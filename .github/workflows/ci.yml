name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          set +x
          FLASK_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32), end="")')"
          ADMIN_PASSWORD_HASH="$(python -c 'import secrets; from werkzeug.security import generate_password_hash; print(generate_password_hash(secrets.token_urlsafe(24)), end="")')"
          export FLASK_SECRET_KEY
          export ADMIN_PASSWORD_HASH
          python -m pytest
