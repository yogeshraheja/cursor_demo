<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Server monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <p class="eyebrow">This Linux machine</p>
      <p class="title">Server monitor</p>
    </div>
    <nav>
      {% if logged_in %}
        <a href="{{ url_for('dashboard') }}"{% if request.endpoint == 'dashboard' %} aria-current="page"{% endif %}>Dashboard</a>
        {% if monitored_server %}
          <a href="{{ url_for('server_detail') }}"{% if request.endpoint == 'server_detail' %} aria-current="page"{% endif %}>Server</a>
        {% endif %}
        <form class="sign-out" method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit">Sign out</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
